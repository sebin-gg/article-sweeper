name: ci

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Official skill validator (skills-ref)
        # Same locked file as the test job: PyPI skills-ref (wheel),
        # every artifact hash-pinned -> no unpinned VCS install.
        run: |
          pip install --only-binary=:all: --require-hashes -r requirements-ci.txt
          agentskills validate article-sweeper
        # (block scalar: the ":" in --only-binary=:all: would break a
        # plain scalar)
      - name: Lint skill
        run: |
          python - <<'EOF'
          import re
          from pathlib import Path

          root = Path("article-sweeper")
          text = (root / "SKILL.md").read_text(encoding="utf-8")
          frontmatter = text.split("---")[1]
          name = re.search(r"^name:\s*(\S+)", frontmatter, re.M).group(1)
          assert name == root.name, f"name {name} != folder {root.name}"
          assert "description:" in frontmatter, "description missing"
          assert (root / "SKILL.md").stat().st_size > 0
          for ref in ("references/chromium.md", "references/firefox.md",
                      "references/dev-mode.md"):
              assert (root / ref).exists(), f"missing {ref}"
          for script in ("scripts/sweep_lib.py",
                          "scripts/list_cdp_tabs.py",
                          "scripts/cdp_close.py",
                          "scripts/decode_firefox_session.py",
                          "scripts/fetch_articles.py"):
              compile((root / script).read_text(encoding="utf-8"), script, "exec")
          version = re.search(r"^\s*version:\s*[\"']?([^\s\"']+)",
                              frontmatter, re.M).group(1)
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert f"[{version}]" in changelog, \
              f"CHANGELOG has no entry for version {version}"
          print("skill lint ok")
          EOF

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      - name: Behavioral tests (mocked CDP / Firefox fixtures)
        run: python -m pytest tests/ -q

  mutation-guard:
    # Proves the safety tests can still FAIL. One-off mutation testing is only
    # true on the day it is run; re-running the mutants here means a test that
    # silently stops discriminating (an edited helper making its assertions
    # vacuous) breaks the build instead of the guarantee.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      - name: Every mutant must be caught
        run: python tests/mutation_guard.py --keep-going

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      - name: Behavioral tests on macOS
        run: python -m pytest tests/ -q
      - name: macOS validation report
        if: always()
        run: |
          {
            echo "## macOS validation"
            echo "- Runner: $(sw_vers -productVersion) ($(uname -m))"
            echo "- Python: $(python3 --version)"
            echo "- Result: ${{ job.status }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Cross-platform / cross-version parity. ADDITIVE on purpose: `main` is
  # branch-protected with required status checks pinned to the literal job
  # names "lint" and "test". Matrixing `test` directly would rename its check
  # contexts to "test (3.11)" etc., the pinned context would never report, and
  # the PR could never merge. So `test` above is untouched and the extra
  # coverage lives in its own jobs.
  #
  # Python versions are fanned out on ubuntu only: Linux minutes are the only
  # ones free for private repos too, so this stays free even if visibility
  # flips. The macOS and Windows legs stay single-version smoke tests.
  # ---------------------------------------------------------------------------
  test-python-versions:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      - name: Behavioral tests
        run: python -m pytest tests/ -q

  coverage:
    # Coverage flags live here rather than in a pytest.ini addopts block on
    # purpose: --cov in addopts would break a plain `pytest` run for anyone
    # without pytest-cov installed locally, which is a normal dev state.
    #
    # --cov-fail-under is a ratchet, not an aspiration: the measured baseline is
    # 66% over article-sweeper/scripts. Raise it as tests are added.
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      - name: Tests with coverage
        run: >-
          python -m pytest tests/ -q
          --cov=article-sweeper/scripts
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=60
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14

  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      # The sweep drives Chromium/Firefox over the DevTools Protocol; a Windows
      # leg is what proves no POSIX-only path assumptions leaked into the client.
      - name: Behavioral tests on Windows
        run: python -m pytest tests/ -q
      - name: Windows validation report
        if: always()
        run: |
          {
            echo "## Windows validation"
            echo "- Runner: $env:OS"
            echo "- Python: $(python --version)"
            echo "- Result: ${{ job.status }}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> $env:GITHUB_STEP_SUMMARY

  test-linux-arm:
    # Real aarch64 kernel. The sweep parses HTML and drives CDP; an ARM leg is
    # what catches alignment and pointer-width assumptions an x86_64 run cannot.
    # setup-python publishes aarch64 CPython wheels for every version in the
    # matrix, so this stays a single-version smoke leg rather than a full
    # version x arch matrix.
    name: Test (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test deps (hash-locked)
        run: "pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"
      - name: Behavioral tests on Linux ARM64
        run: python -m pytest tests/ -q
      - name: ARM validation report
        if: always()
        run: |
          {
            echo "## Linux ARM64 validation"
            echo "- Arch: \`$(uname -m)\`"
            echo "- Kernel: \`$(uname -r)\`"
            echo "- Python: \`$(python3 --version)\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
